name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Dependency/supply-chain audit (#57 security review): fails the build
      # on any new high/critical advisory with a published fix.
      # `--ignore-unfixable` skips only advisories with no patched version
      # available at all (currently one: extract-zip via @lhci/cli's
      # Puppeteer downloader, dev-only — see docs/security-checklist.md for
      # the accepted-risk rationale and re-run instructions) rather than
      # silently accepting every unfixable advisory forever; a newly
      # disclosed unfixable advisory still surfaces here as a job failure
      # until it's re-triaged and the checklist is updated.
      - name: Dependency audit
        run: pnpm run audit

      # Biome intermittently dies with exit 254 ("Linter process terminated
      # abnormally", an out-of-memory-ish crash in its own process) instead of
      # reporting diagnostics. It is not a lint result: the same tree passes on
      # the next attempt. Retry ONLY that exit code — any real lint failure
      # (exit 1) fails the step immediately, so this cannot mask a diagnostic.
      - name: Biome check
        run: |
          for attempt in 1 2 3; do
            set +e
            pnpm biome check .
            status=$?
            set -e
            if [ "$status" -ne 254 ]; then
              exit "$status"
            fi
            echo "::warning::Biome exited 254 (crash, not a lint result) on attempt ${attempt}; retrying."
            sleep 5
          done
          echo "::error::Biome exited 254 on three consecutive attempts."
          exit 254

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Validate career data content
        run: pnpm turbo validate

      - name: Lint career data content
        run: pnpm turbo lint:content

      # apps/web/lib/cv/generate-cv-pdf.test.ts (#35) launches real headless
      # Chromium via Playwright as part of `pnpm turbo test` below — same
      # browser the `e2e` job already caches/installs, mirrored here rather
      # than skipping unit-test coverage for the one test that needs a real
      # renderer.
      - name: Resolve installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium (with OS deps)
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm turbo test

      - name: Build
        run: pnpm turbo build

      - name: Check generated connect regions are up to date (#17)
        run: pnpm generate:connect:check

      - name: Check llms.txt / llms-full.txt generation is valid (#37)
        run: pnpm generate:llms:check

      - name: Verify README local-development commands (#23)
        run: node scripts/ci/verify-readme-local-dev.mjs

  # No `needs: quality` — e2e runs in parallel with quality so a broken page
  # is reported as an e2e failure (not skipped because quality also failed)
  # and both are independently required status checks on main.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium (with OS deps)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # No `needs: quality` — same reasoning as `e2e`: runs in parallel so a
  # broken protocol/rate-limit path is reported as its own failure instead
  # of being skipped because `quality` also failed.
  mcp-integration:
    name: mcp-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run protocol-level MCP integration tests
        run: pnpm test:mcp

  # Real-Neon integration suite for packages/core's pgvector store (#14) and
  # ingestion pipeline (#24): creates a throwaway Neon branch, runs
  # migrations against it, exercises upsert idempotency + ANN ordering, and
  # the full insert/no-op-rerun/edit/delete/--full/model-change ingest cycle
  # (with a faked, no-network embedder), deletes the branch on teardown. Its
  # own job (not folded into `quality`) so a slow/flaky Neon branch-create
  # call never blocks that required check — see docs/development.md
  # "Database integration tests". Not in the required-status-checks list,
  # same reasoning as `agent-evals`/the `docs-rot-*` jobs below.
  #
  # NEON_API_KEY (secret) / NEON_PROJECT_ID (repository variable) are never
  # available to fork PRs (GitHub withholds secrets, but variables ARE
  # inherited by fork PRs per GitHub's docs — so the check below is on the
  # secret only), which is exactly the case this job's own guard skips
  # cleanly for, mirroring `preview-e2e`/`lighthouse`'s fork-PR handling.
  db-integration:
    name: db-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for required secrets (skips on fork PRs)
        id: secrets-check
        run: |
          if [ -z "${{ secrets.NEON_API_KEY }}" ] || [ -z "${{ vars.NEON_PROJECT_ID }}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping db-integration — NEON_API_KEY/NEON_PROJECT_ID are unavailable (expected for fork PRs, which never receive repo secrets)."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # src/ingest/run.integration.test.ts (#24) imports packages/core's
      # repository.js, which imports @hire-me-mcp/career-data at the top
      # level — that resolves to its compiled dist/index.js (see this
      # package's own "exports" field), so without building it first this
      # job fails with "Failed to resolve entry for package
      # @hire-me-mcp/career-data" even though the plain db/rag-store suite
      # (no career-data import) worked fine without it. Same pattern as
      # preview-e2e/lighthouse's "Build packages/core, packages/career-data
      # ..." step below.
      - name: Build packages/career-data
        if: steps.secrets-check.outputs.available == 'true'
        run: pnpm turbo run build --filter=@hire-me-mcp/career-data

      - name: Run the Neon pgvector integration suite
        if: steps.secrets-check.outputs.available == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: pnpm --filter @hire-me-mcp/core exec vitest run src/db/rag-store.integration.test.ts src/ingest/run.integration.test.ts src/search-career.integration.test.ts src/analytics/analytics.integration.test.ts

  # Runs against the PR's real Vercel preview deployment (#58), not
  # localhost — resolved via .github/actions/resolve-vercel-preview, a
  # composite action shared with the `lighthouse` job below so the
  # deployment-polling logic exists exactly once (see the shared-infra note
  # on issue #58, also relevant to #69 and #59). Independent of `quality`/
  # `e2e` (no `needs:`) and only meaningful for `pull_request` — a push to
  # `main` produces a Production deploy, not a Preview one, and this suite
  # is specifically about gating what merges into `main`.
  #
  # `pnpm test:e2e:preview` also runs apps/web/e2e-preview/specs/mcp.spec.ts
  # (#69) — the MCP endpoint smoke suite (real SDK client, initialize/
  # tools-list/tools-call/error-path/rate-limit-header checks against the
  # deployed /api/mcp) — in the same run, deliberately reusing this job/config
  # rather than a separate one so preview-targeting reporting stays in one
  # place. See apps/web/README.md and the root README's preview-gates section.
  #
  # ## No live model calls in this job (#264)
  #
  # This is a REQUIRED check, so nothing it runs may depend on a third
  # party's free-tier daily allowance. It used to: two live-model chat
  # conversations plus six live chat-latency samples ran here, and when the
  # Preview-scoped Google project hit its 500 requests/day cap they failed on
  # EVERY open PR regardless of content (#259/#262/#263, same day, identical
  # failures) — a merge queue gated on a quota reset.
  #
  # Letting the required check pass when the provider misbehaves was rejected
  # as a merge bypass. Instead the chat contract is now asserted
  # DETERMINISTICALLY here (chat-deterministic.spec.ts, driven by
  # apps/web/lib/chat/test-scenarios.ts's scripted, production-impossible
  # response path — citation rendering for every entity type, the honest
  # error copy, the #222 multi-turn sanitizer), and the live-model proof moved
  # to the separate, NON-required `preview-chat-live` workflow. The
  # `test:e2e:preview` script pins the three model-free projects by name;
  # anything tagged `@live-model` can only run in the other lane. Quota can
  # no longer make this check red OR green.
  #
  # VERCEL_AUTOMATION_BYPASS_SECRET (already passed below for Deployment
  # Protection) doubles as the credential that unlocks the scripted path —
  # no new secret. The `gemini-free-tier` concurrency group went with the
  # live specs — see the job's own note below for why staying in it was
  # actively harmful once this job stopped calling the model.
  preview-e2e:
    name: preview-e2e
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # NO `gemini-free-tier` concurrency group any more (#264). It was added
    # by #169 because this job's chat specs made real model calls and
    # agent-evals running concurrently starved them past Vercel's function
    # limit. Since #264 this job makes no model calls at all, so the shared
    # budget it was queueing for no longer concerns it — and staying in the
    # group actively harmed it: GitHub keeps only ONE pending run per
    # concurrency group, so a newer waiter cancels the older one. With
    # agent-evals, retrieval-eval and preview-chat-live all contending, this
    # REQUIRED check was cancelled outright on the first run of PR #265 —
    # the same "a required check that could not pass for reasons unrelated
    # to the change" failure mode #176 and #264 are both about.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fork PRs never carry repo secrets (GitHub withholds them for
      # security), so VERCEL_AUTOMATION_BYPASS_SECRET is empty here — this
      # step, and therefore the whole job, skips with an explicit message
      # instead of failing on an unresolvable/unauthenticated preview.
      - name: Check for required secrets (skips on fork PRs)
        id: secrets-check
        run: |
          if [ -z "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping preview-e2e — VERCEL_AUTOMATION_BYPASS_SECRET is unavailable (expected for fork PRs, which never receive repo secrets)."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Vercel preview URL
        id: preview
        if: steps.secrets-check.outputs.available == 'true'
        uses: ./.github/actions/resolve-vercel-preview
        with:
          sha: ${{ github.event.pull_request.head.sha }}

      # @hire-me-mcp/agent is included here (in addition to core/career-data)
      # because the chat e2e specs (#73 — chat-grounded.spec.ts,
      # chat-gap.spec.ts) import @hire-me-mcp/agent/citations at the top
      # level, which resolves to its compiled dist/citations.js — without
      # building this package first, the whole preview-e2e Playwright run
      # fails to even load with "Cannot find module .../agent/dist/citations.js".
      - name: Build packages/core, packages/career-data and packages/agent
        if: steps.preview.outputs.found == 'true'
        run: pnpm turbo run build --filter=@hire-me-mcp/core --filter=@hire-me-mcp/career-data --filter=@hire-me-mcp/agent

      - name: Resolve installed Playwright version
        id: playwright-version
        if: steps.preview.outputs.found == 'true'
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.preview.outputs.found == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium (with OS deps)
        if: steps.preview.outputs.found == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run preview e2e suite against the resolved preview URL
        if: steps.preview.outputs.found == 'true'
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "Running the preview e2e suite against: ${BASE_URL}"
          pnpm test:e2e:preview

      - name: No ready preview deployment found
        if: steps.secrets-check.outputs.available == 'true' && steps.preview.outputs.found != 'true'
        run: |
          echo "::warning::No ready Vercel preview deployment was found for ${{ github.event.pull_request.head.sha }} within the timeout — skipping preview-e2e rather than failing red. Re-run this job once the Vercel preview check on this PR is green."

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-preview-report
          path: playwright-preview-report/
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-preview-traces
          path: test-results-preview/
          retention-days: 7

  # Lighthouse budget gate (#58, extended to a full performance-budget gate
  # by #62) — performance/accessibility/best-practices/SEO, Core Web Vitals
  # (LCP/CLS/TBT) and JS/total resource-byte budgets, each read from the
  # committed `lighthouserc.json` (per-page via `assert.assertMatrix` — see
  # `performance-budgets.json` for the measured v1.0 baselines those
  # thresholds sit below) on the preview URL for home, one project detail,
  # /privacy, the CV print view (#35) and /mcp. Shares the same
  # preview-resolution and fork-skip behaviour as `preview-e2e` above.
  lighthouse:
    name: lighthouse
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for required secrets (skips on fork PRs)
        id: secrets-check
        run: |
          if [ -z "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping lighthouse — VERCEL_AUTOMATION_BYPASS_SECRET is unavailable (expected for fork PRs, which never receive repo secrets)."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Vercel preview URL
        id: preview
        if: steps.secrets-check.outputs.available == 'true'
        uses: ./.github/actions/resolve-vercel-preview
        with:
          sha: ${{ github.event.pull_request.head.sha }}

      - name: Build packages/core and packages/career-data
        if: steps.preview.outputs.found == 'true'
        run: pnpm turbo run build --filter=@hire-me-mcp/core --filter=@hire-me-mcp/career-data

      - name: Generate per-run Lighthouse config
        if: steps.preview.outputs.found == 'true'
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "Running Lighthouse against: ${BASE_URL}"
          node scripts/lighthouse/build-config.mjs .lighthouserc.local.json

      # #58/#128 stabilization: a Vercel preview lambda that hasn't served a
      # request yet eats a cold-start penalty on whichever URL Lighthouse
      # happens to hit first (observed: home scored 0.88 vs 1.00 for the
      # other two URLs in run 32409684979, job 96556951552, on the very
      # first request of the run). One throwaway request per audited URL
      # here means Lighthouse's own runs never pay that penalty — paired
      # with `lighthouserc.cjs`'s `numberOfRuns: 3` (median-of-3) and the
      # calibrated 0.90 `performance` threshold for defense in depth.
      - name: Warm up preview URLs
        if: steps.preview.outputs.found == 'true'
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          # Reads the same URL list the Lighthouse run is about to use —
          # already resolved by the previous step's build-config.mjs, so
          # there's no second copy of the slug-resolution logic to drift.
          for url in $(node -p "require('./.lighthouserc.local.json').ci.collect.url.join('\n')"); do
            echo "Warming up: ${url}"
            curl -sS -o /dev/null -w "  -> %{http_code}\n" \
              -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              "${url}" || echo "  -> warm-up request failed (non-fatal, Lighthouse will still run)"
          done

      - name: Run Lighthouse CI
        if: steps.preview.outputs.found == 'true'
        run: pnpm exec lhci autorun --config=.lighthouserc.local.json

      - name: Print Lighthouse scores
        if: steps.preview.outputs.found == 'true' && always()
        run: node scripts/lighthouse/print-scores.mjs

      - name: No ready preview deployment found
        if: steps.secrets-check.outputs.available == 'true' && steps.preview.outputs.found != 'true'
        run: |
          echo "::warning::No ready Vercel preview deployment was found for ${{ github.event.pull_request.head.sha }} within the timeout — skipping lighthouse rather than failing red. Re-run this job once the Vercel preview check on this PR is green."

      - name: Upload Lighthouse report
        if: always() && steps.preview.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          # upload-artifact@v4 skips hidden files/dirs by default (its
          # 2024-08 security change) — without this the `.lighthouseci`
          # dot-directory uploads nothing, with only a log warning.
          include-hidden-files: true
          retention-days: 7
