name: Retrieval Eval

# Runs `pnpm eval:retrieval` (#41, epic #6) for real: `searchCareer` (#34)
# scored against the golden dataset's recall@k/precision@k/MRR thresholds
# (`packages/core/src/eval-retrieval/thresholds.ts`), on a database this
# workflow itself provisions, migrates, and populates — the PR-triggered
# required check #52 promises: "a PR that degrades retrieval below the
# committed thresholds fails the required check and cannot be merged."
#
# ## Why a dedicated, disposable Neon branch per run
#
# Unlike `db-integration` (`ci.yml`), which only needs an empty, migrated
# schema, this workflow needs a REAL populated store — `pnpm ingest` (#24)
# run against the branch before the eval queries it. Sharing the project's
# main database would mean every run's ingest either mutates production
# data or silently no-ops against already-current content, neither of which
# is what "run the eval for real" should mean. `scripts/ci/retrieval-eval/neon-branch.mjs`
# creates a fresh branch, exposes it as `DATABASE_URL` for the rest of the
# job via `$GITHUB_ENV`, and an `always()` step deletes it afterward —
# mirroring `packages/core/src/db/neon-branch.ts`'s create/delete pair the
# integration test suites use, but as a standalone pre-build script (see
# that file's own docstring for why it doesn't import `packages/core`).
# `scripts/ci/neon-branch-cleanup.mjs` (scheduled separately, see below) is
# the safety net for branches this step's own `always()` cleanup somehow
# misses (hard runner crash, cancelled mid-step).
#
# ## Trigger strategy — path-filtered pull_request (#52), not every PR
#
# Provisioning a Neon branch and running a real ingest touches the
# embedding API for every changed/new chunk, but ingestion is incremental
# (#24) — unchanged content makes zero embedding calls, so restricting the
# trigger to paths that can actually change what gets indexed or how
# retrieval scores (`packages/core/**`, the career-data content itself, this
# workflow and its helper script) keeps the steady-state cost near zero
# without gating PRs that have nothing to do with retrieval. `workflow_dispatch`
# stays available for an on-demand full run (e.g. re-verifying after a
# threshold change). This is now a REQUIRED status check (#52) — see
# `docs/development.md`'s "Continuous integration and branch protection"
# section.
# Trigger design (#176): this is a REQUIRED status check, and a required
# check that never reports leaves a PR permanently "Expected — waiting for
# status" — trigger-level `paths:` filtering did exactly that to every PR
# outside the filter, and a compensating `workflow_dispatch` run does NOT
# attach a status context to the PR, so it cannot satisfy branch
# protection. The job therefore runs on EVERY pull request and does its own
# changed-paths detection in the "Detect retrieval-relevant changes" step
# below: irrelevant PRs report green in seconds with zero Neon branches and
# zero embedding calls.
on:
  workflow_dispatch: {}
  pull_request:

concurrency:
  group: retrieval-eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrieval-eval:
    name: retrieval-eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level: queue behind (never race) other Gemini-calling CI jobs —
    # this job's ingest + eval:retrieval steps make real embedding calls
    # against the same free-tier quota agent-evals/preview-e2e's chat specs
    # share (#169). The shared `gemini-free-tier` group queues those jobs
    # instead of racing them; a group only ever holds one queued run, so an
    # extra concurrent trigger is cancelled rather than run — a
    # cancelled-while-queued run shows as a failed check on the PR and just
    # needs a manual re-run once the group frees up.
    concurrency:
      group: gemini-free-tier
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fork PRs never carry repo secrets (GitHub withholds them for
      # security) — skip with an explicit notice instead of failing red on
      # an unresolvable Neon/embedding call, same pattern as
      # ci.yml's db-integration/preview-e2e/lighthouse and agent-evals.yml.
      # #176: the trigger runs on every PR (see the `on:` comment); this
      # step keeps the COST filter — when a PR touches nothing that can
      # change what gets indexed or how retrieval scores, the expensive
      # steps are skipped and the required check still reports green.
      # workflow_dispatch runs are always treated as relevant.
      - name: Detect retrieval-relevant changes
        id: relevance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files" --paginate -q '.[].filename')
          if echo "$FILES" | grep -qE '^(packages/core/|packages/career-data/content/|packages/career-data/src/|\.github/workflows/retrieval-eval\.yml|scripts/ci/retrieval-eval/)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No retrieval-relevant changes in this PR — skipping Neon/embedding work; the required check reports green (#176)."
          fi

      - name: Check for required secrets (skips on fork PRs and irrelevant PRs)
        id: secrets-check
        run: |
          if [ "${{ steps.relevance.outputs.relevant }}" != "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${{ secrets.NEON_API_KEY }}" ] || [ -z "${{ vars.NEON_PROJECT_ID }}" ] || [ -z "${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping retrieval-eval — NEON_API_KEY/NEON_PROJECT_ID/GOOGLE_GENERATIVE_AI_API_KEY are unavailable (expected for fork PRs, which never receive repo secrets)."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # packages/core/src/repository.ts imports @hire-me-mcp/career-data at
      # the top level, which resolves via that package's own "exports" field
      # to its compiled dist/ — db:migrate/ingest/eval:retrieval all fail
      # with "Failed to resolve entry for package @hire-me-mcp/career-data"
      # without this, same as db-integration's equivalent step in ci.yml.
      - name: Build packages/career-data
        if: steps.secrets-check.outputs.available == 'true'
        run: pnpm turbo run build --filter=@hire-me-mcp/career-data

      - name: Create disposable Neon branch
        id: neon-branch
        if: steps.secrets-check.outputs.available == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: node scripts/ci/retrieval-eval/neon-branch.mjs create

      - name: Run migrations
        if: steps.secrets-check.outputs.available == 'true'
        run: pnpm --filter @hire-me-mcp/core db:migrate

      # Full ingest (not --dry-run): the branch starts empty, so this is
      # always a full initial population, not an incremental no-op.
      - name: Ingest career data (real embeddings)
        if: steps.secrets-check.outputs.available == 'true'
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: pnpm ingest

      - name: Run retrieval eval (real embeddings, real thresholds)
        if: steps.secrets-check.outputs.available == 'true'
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: pnpm --filter @hire-me-mcp/core eval:retrieval

      # always(), not tied to the previous step's outcome: a threshold
      # breach makes the eval step exit non-zero (this job correctly red),
      # but the report it wrote is exactly what a reviewer needs to see —
      # same "summarize regardless of pass/fail" pattern as agent-evals.yml.
      - name: Render job summary (aggregate metrics vs. thresholds, verdict)
        if: always() && steps.secrets-check.outputs.available == 'true'
        run: node scripts/ci/retrieval-eval/summary.mjs packages/core/retrieval-eval-report.json

      - name: Upload retrieval eval report artifact
        if: always() && steps.secrets-check.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval-report
          path: packages/core/retrieval-eval-report.json
          retention-days: 30
          if-no-files-found: warn

      # always(): the branch must be deleted whether the eval passed,
      # failed its thresholds, or the job errored earlier — never leak a
      # Neon branch on a failed run.
      - name: Delete disposable Neon branch
        if: always() && steps.neon-branch.outcome == 'success'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ steps.neon-branch.outputs.branch-id }}
        run: node scripts/ci/retrieval-eval/neon-branch.mjs delete
