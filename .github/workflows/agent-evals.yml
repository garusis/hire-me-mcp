name: Agent Evals

# Gates the interview agent's honesty guarantees on real, budget-capped
# model output (#73 — final task of the v0.5 Interview Chat Agent epic,
# #5). `pnpm eval:agent` (`packages/agent/src/evals/cli.ts`) makes REAL
# Gemini calls against `getInterviewAgent()` and fails the build
# (non-zero exit) when a scorer aggregate drops below its committed
# threshold (`packages/agent/src/evals/thresholds.ts`).
#
# #75 (epic #6) extended the dataset with RAG-grounded cases exercising the
# agent's new `search-career` semantic-search tool — this job's "the
# extended agent eval suite runs in CI" acceptance criterion — and is what
# this workflow means by "wired in alongside the retrieval evals from #52"
# (`retrieval-eval.yml`): both jobs share the `gemini-free-tier`
# concurrency group below so they queue rather than race for the same
# free-tier quota, and this job now also requires `DATABASE_URL` (the same
# repo secret `reindex-production.yml` uses) so `search-career` has a real
# store to query.
#
# ## Why a SEPARATE workflow file, not a job in ci.yml
#
# This job has its own trigger set (`labeled` PRs for the run-evals
# override, `workflow_dispatch` with a `max_cases` input, `push` to main)
# and its own `gemini-free-tier` queueing semantics — a standalone
# workflow keeps that self-contained instead of entangling it with
# quality/e2e/mcp-integration's plain every-PR triggers.
#
# ## Trigger strategy — every PR, in-job relevance detection (#207, #176)
#
# The model is `gemini-3.5-flash-lite` free tier: 15 RPM / 500 RPD, SHARED
# with live production chat traffic (see `packages/agent/README.md`'s
# quota rationale table). Running the ~25-case eval suite (real model
# spend) on every PR — docs, unrelated packages, CI config — would burn
# shared quota for no signal. But workflow-level `paths:` filtering is
# BANNED here by the #176 lesson: a required check that never runs leaves
# a PR permanently "Expected — waiting for status", and this job must stay
# compatible with becoming required. So the workflow triggers on EVERY
# pull request, and the "Detect agent-relevant changes" step below decides
# in-job (#207) whether the expensive steps run:
#
#   1. Turborepo dependency graph — `scripts/ci/eval-relevance.mjs` runs
#      `turbo query`'s `affectedPackages` against the PR's merge base;
#      the suite is relevant iff `@hire-me-mcp/agent` is affected, i.e.
#      the agent package itself OR anything in its dependency closure
#      (`@hire-me-mcp/core`, `@hire-me-mcp/career-data`, per-package
#      lockfile changes, root config) changed. Transitive dependency
#      changes are caught without a hand-maintained path list.
#   2. An explicit path regex for assets outside that module graph: this
#      workflow file, the relevance/summary CI scripts, and the chat
#      route wiring.
#   3. A `run-evals` PR label forces a run regardless of the diff (the
#      `labeled` trigger type below fires a fresh run when it's added).
#
# The decision FAILS OPEN: any detection error (git, turbo, parsing)
# runs the full suite rather than silently skipping the gate. Irrelevant
# PRs report green in seconds with zero Gemini calls. See
# `docs/development.md` > "What triggers the eval workflows".
#
# `workflow_dispatch` covers an on-demand full run (e.g. re-verifying
# after a quota reset, or a manual threshold-bump demonstration per #73's
# acceptance criteria). `push` to `main` keeps main's own history gated
# too (same in-job detection, diffed against the pre-push sha), since a
# merge can combine changes that individually passed review but regress
# in combination.
#
# ## Required-check decision: NOT (yet) a required status check
#
# Historically this workflow was path-filtered, which is fundamentally
# incompatible with being required (#176 — a path-filtered required check
# permanently blocks every PR outside its paths). Since #207 it runs on
# every PR and always attaches a status, so making it required is now
# POSSIBLE; it stays non-required for the fork-PR reason `db-integration`
# shares (no repo secrets → skip must not block unrelated merges). See
# `packages/agent/README.md`'s "Running evals in CI" section.
#
# ## No-secrets / fork-PR behaviour
#
# `GOOGLE_GENERATIVE_AI_API_KEY` is a repository secret and is NEVER
# provided to a workflow run triggered by a fork PR (GitHub withholds all
# repo secrets from fork PRs by design). The `secrets-check` step below
# detects that and the job exits early with an explicit `::notice::`
# instead of failing red on an unauthenticated/misconfigured provider call
# — same pattern as `ci.yml`'s `preview-e2e`/`lighthouse` jobs.
on:
  pull_request:
    # No `paths:` filter (#176/#207 — see the module header). `labeled` is
    # added to the default types so applying the `run-evals` override
    # label fires a fresh run with the label visible in the event payload.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      max_cases:
        description: "Override EVAL_MAX_CASES for this run (default: full 25-case dataset)"
        required: false
        default: "25"

concurrency:
  group: agent-evals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-evals:
    name: agent-evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level: queue behind (never race) other Gemini-calling CI jobs —
    # preview-e2e's chat specs share the same 15 RPM free-tier budget and
    # starve out when this job runs concurrently (#169).
    concurrency:
      group: gemini-free-tier
      cancel-in-progress: false
    # Budget caps below cover a full 25-case dataset run — #143's real
    # 17-case run used 111,137 tokens; #75 (this comment's own change) added
    # 8 more cases (three RAG-grounded fuzzy/cross-cutting, two RAG-grounded
    # absent-topic, one exact-fact tool-routing case, mirrored into the
    # `grounded`/`gap` categories, see `packages/agent/src/evals/dataset/cases.ts`),
    # so the token cap below is raised proportionally with margin, not
    # measured against a real 25-case run yet (this package's local `.env`
    # key is a known-invalid placeholder — see `packages/agent/README.md`) —
    # `assertWithinBudget` (`packages/agent/src/evals/budget.ts`) still
    # aborts loudly if a run genuinely exceeds it, so an underestimate here
    # fails loud rather than silently truncating. EVAL_RPM_LIMIT stays at
    # the package default (10) — a polite margin under the model's 15 RPM
    # ceiling, shared with production chat traffic. EVAL_REPORT_PATH is
    # intentionally left at its default ("eval-report.json", resolved
    # relative to `pnpm eval:agent`'s own working directory,
    # `packages/agent`) rather than overridden here — `pnpm --filter
    # @hire-me-mcp/agent eval:agent` (what the root `eval:agent` script
    # below runs) executes with `packages/agent` as its cwd, so the
    # default already lands at `packages/agent/eval-report.json` relative
    # to the repo root, which is exactly the path the later steps
    # (summary render, artifact upload) reference.
    env:
      EVAL_MAX_CASES: ${{ github.event.inputs.max_cases || '25' }}
      EVAL_MAX_TOTAL_TOKENS: "260000"
      EVAL_MAX_COST_USD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the relevance step diffs against the PR's merge
          # base (or the pre-push sha) via `git merge-base`/`turbo query`,
          # which a depth-1 clone cannot resolve (#207).
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # #207: decide in-job whether this PR/push can change agent behavior
      # — turborepo affected-package graph (is @hire-me-mcp/agent affected?)
      # plus an explicit regex for non-imported assets, with a `run-evals`
      # label override. Fails OPEN (detection error → run). Labels are read
      # live from the API, not the (re-run-stale) event payload, so
      # label-then-re-run works as well as the `labeled` trigger. See the
      # module header and `scripts/ci/eval-relevance.mjs`.
      - name: Detect agent-relevant changes (turborepo graph + asset regex)
        id: relevance
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || github.event.before }}
          TARGET_PACKAGE: "@hire-me-mcp/agent"
          EXTRA_PATH_REGEX: '^(\.github/workflows/agent-evals\.yml|scripts/ci/eval-relevance|scripts/ci/eval-summary\.mjs|apps/web/app/api/chat/)'
          OVERRIDE_LABEL: run-evals
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            PR_LABELS=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --paginate -q '.[].name' || true)
            export PR_LABELS
          fi
          node scripts/ci/eval-relevance.mjs

      # Fork PRs never carry repo secrets, so GOOGLE_GENERATIVE_AI_API_KEY
      # (and, since #75, DATABASE_URL — the interview agent's
      # search-career tool needs both to run a real semantic-search tool
      # call) are empty here — skip with an explicit notice instead of
      # failing on an unauthenticated provider/DB call. See the module
      # header above. DATABASE_URL points at the same production database
      # `reindex-production.yml` reads/writes — a read-only ANN query
      # against it is safe; there's no disposable-Neon-branch provisioning
      # here the way `retrieval-eval.yml` does, since this job doesn't
      # ingest anything. #207: this step also folds in the relevance
      # decision above, same shape as retrieval-eval.yml's equivalent step.
      - name: Check for required secrets (skips on fork PRs and irrelevant PRs)
        id: secrets-check
        run: |
          if [ "${{ steps.relevance.outputs.relevant }}" != "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}" ] || [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping agent-evals — GOOGLE_GENERATIVE_AI_API_KEY and/or DATABASE_URL is unavailable (expected for fork PRs, which never receive repo secrets)."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build workspace packages the agent depends on
        if: steps.secrets-check.outputs.available == 'true'
        run: pnpm turbo run build --filter=@hire-me-mcp/core --filter=@hire-me-mcp/career-data --filter=@hire-me-mcp/agent

      # Safe diagnostic — never echoes the secret's value, only a SHA-256
      # fingerprint (first 16 hex chars) and its length. Exists to
      # distinguish two very different failure classes for "the eval step
      # says the API key isn't valid": (a) secret DELIVERY is broken (a
      # stale secrets snapshot on a re-run, a trailing-newline/whitespace
      # corruption at set-time, ...) — the fingerprint printed here won't
      # match the known-good local value; or (b) the key genuinely reaches
      # the runner correctly but Google rejects the call anyway (e.g. a
      # free-tier key rejecting the runner's region/IP) — the fingerprint
      # matches, and the eval step's own error is the real, environmental
      # signal. Known-good fingerprint for the current key (computed
      # locally the same way, verified once against this exact command):
      # `2ae3654173e92d09`, length `53`.
      - name: Diagnose provided key (fingerprint only — never the value)
        if: steps.secrets-check.outputs.available == 'true'
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: |
          echo "key fingerprint: $(printf '%s' "$GOOGLE_GENERATIVE_AI_API_KEY" | sha256sum | cut -c1-16) length: ${#GOOGLE_GENERATIVE_AI_API_KEY}"

      - name: Run eval suite (real model calls, budget-capped)
        if: steps.secrets-check.outputs.available == 'true'
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm eval:agent

      - name: Render job summary (per-scorer aggregates, verdict, totals)
        # always(), not tied to the previous step's outcome: a threshold
        # breach makes the eval step exit non-zero (this job red, correctly),
        # but the report it wrote is exactly what a reviewer needs to see —
        # same "summarize regardless of pass/fail" pattern as ci.yml's
        # `lighthouse` job's "Print Lighthouse scores" step.
        if: always() && steps.secrets-check.outputs.available == 'true'
        run: node scripts/ci/eval-summary.mjs packages/agent/eval-report.json

      - name: Upload eval report artifact
        if: always() && steps.secrets-check.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report
          path: packages/agent/eval-report.json
          retention-days: 30
          if-no-files-found: warn
